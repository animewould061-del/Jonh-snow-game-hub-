<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turbo Racer - Ahatesham</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: #fff; overflow: hidden; }
    
    .creator-badge { position: absolute; top: 15px; right: 15px; background: rgba(56, 189, 248, 0.15); border: 1px solid #38bdf8; color: #38bdf8; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; backdrop-filter: blur(5px); z-index: 100; }

    #game-container { position: relative; width: 340px; height: 480px; background: #1e293b; border: 4px solid #38bdf8; border-radius: 12px; overflow: hidden; box-shadow: 0 0 25px rgba(56, 189, 248, 0.3); transition: background 0.5s ease; }
    .road-line { position: absolute; width: 6px; height: 40px; background: #64748b; left: 50%; transform: translateX(-50%); }
    
    #player { position: absolute; bottom: 20px; width: 40px; height: 70px; background: #ef4444; border-radius: 8px; border: 2px solid #991b1b; transition: left 0.1s ease, border-color 0.2s; z-index: 2; }
    #player::before { content: ''; position: absolute; top: 12px; left: 6px; width: 24px; height: 16px; background: #38bdf8; border-radius: 3px; }
    #player.shielded { border: 3px solid #06b6d4; box-shadow: 0 0 15px #06b6d4; }
    
    .enemy { position: absolute; width: 40px; height: 70px; background: #eab308; border-radius: 8px; border: 2px solid #854d0e; }
    .powerup { position: absolute; width: 30px; height: 30px; background: #06b6d4; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 10px #06b6d4; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; }

    .shake { animation: shakeAnim 0.3s ease-in-out; }
    @keyframes shakeAnim {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    
    #ui { display: flex; gap: 15px; margin-bottom: 12px; font-size: 14px; font-weight: bold; background: #0f172a; padding: 8px 18px; border-radius: 20px; border: 1px solid #334155; }
    .val { color: #facc15; }
    #controls { margin-top: 15px; display: flex; gap: 10px; }
    .btn { padding: 12px 18px; font-size: 14px; font-weight: bold; background: #1e293b; border: 2px solid #38bdf8; color: #38bdf8; border-radius: 10px; cursor: pointer; }
    
    #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999; padding: 20px; text-align: center; }
    #start-btn { padding: 12px 26px; font-size: 16px; font-weight: bold; background: #22c55e; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; }
    .record-msg { color: #4ade80; font-size: 14px; margin-top: 8px; font-weight: bold; }
  </style>
</head>
<body>

<div class="creator-badge">Created by: Ahatesham</div>

<div id="ui">
  <div>Score: <span id="score" class="val">0</span></div>
  <div>Lvl: <span id="level" class="val">1</span></div>
  <div>Best: <span id="highscore" class="val">0</span></div>
</div>

<div id="game-container">
  <div id="player"></div>
  <div id="overlay">
    <h1 id="game-title" style="color: #38bdf8; font-size: 26px;">TURBO RACER</h1>
    <p id="score-details" style="font-size: 14px; color: #94a3b8; margin-top: 8px;">Try to set a new High Score!</p>
    <div id="record-banner" class="record-msg" style="display: none;">🎉 NEW PERSONAL BEST!</div>
    <button id="start-btn" onclick="startGame()">START GAME</button>
  </div>
</div>

<div id="controls">
  <button class="btn" onclick="moveLeft()">◀ LEFT</button>
  <button class="btn" onclick="location.reload()" style="background: #ef4444; border-color: #991b1b; color: #fff;">🔄 RESTART</button>
  <button class="btn" onclick="moveRight()">RIGHT ▶</button>
</div>

<script>
  const container = document.getElementById('game-container');
  const player = document.getElementById('player');
  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const highscoreEl = document.getElementById('highscore');
  const overlay = document.getElementById('overlay');
  const gameTitle = document.getElementById('game-title');
  const scoreDetails = document.getElementById('score-details');
  const recordBanner = document.getElementById('record-banner');
  const startBtn = document.getElementById('start-btn');

  const AudioContext = window.AudioContext || window.webkitAudioContext;
  let audioCtx;

  function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }

  function playCrashSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
  }

  function playPowerupSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
  }

  const lanes = [30, 150, 270];
  let currentLane = 1;
  let score = 0;
  let level = 1;
  let highscore = localStorage.getItem('player_best_score') || 0;
  highscoreEl.innerText = highscore;

  let gameInterval;
  let isPlaying = false;
  let speed = 5;
  let enemies = [];
  let powerups = [];
  let lines = [];
  let hasShield = false;

  const bgColors = ['#1e293b', '#311b92', '#1a237e', '#4a148c', '#004d40'];

  for(let i=0; i<5; i++) {
    let line = document.createElement('div');
    line.className = 'road-line';
    line.style.top = (i * 110) + 'px';
    container.appendChild(line);
    lines.push(line);
  }

  function updatePlayerPosition() { player.style.left = lanes[currentLane] + 'px'; }
  function moveLeft() { if(isPlaying && currentLane > 0) { currentLane--; updatePlayerPosition(); } }
  function moveRight() { if(isPlaying && currentLane < 2) { currentLane++; updatePlayerPosition(); } }

  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowLeft') moveLeft();
    if(e.key === 'ArrowRight') moveRight();
  });

  function startGame() {
    initAudio();
    overlay.style.display = 'none';
    recordBanner.style.display = 'none';
    isPlaying = true;
    score = 0; level = 1; speed = 5; currentLane = 1;
    hasShield = false;
    player.classList.remove('shielded');
    container.style.background = bgColors[0];
    updatePlayerPosition();
    scoreEl.innerText = score;
    levelEl.innerText = level;
    
    enemies.forEach(e => e.remove()); enemies = [];
    powerups.forEach(p => p.el.remove()); powerups = [];
    clearInterval(gameInterval);
    gameInterval = setInterval(updateGame, 20);
  }

  function spawnEnemy() {
    let laneIndex = Math.floor(Math.random() * 3);
    let enemy = document.createElement('div');
    enemy.className = 'enemy';
    enemy.style.left = lanes[laneIndex] + 'px';
    enemy.style.top = '-80px';
    container.appendChild(enemy);
    enemies.push({ el: enemy, lane: laneIndex });
  }

  function spawnPowerup() {
    let laneIndex = Math.floor(Math.random() * 3);
    let powerup = document.createElement('div');
    powerup.className = 'powerup';
    powerup.innerText = '🛡️';
    powerup.style.left = (lanes[laneIndex] + 5) + 'px';
    powerup.style.top = '-40px';
    container.appendChild(powerup);
    powerups.push({ el: powerup, lane: laneIndex });
  }

  let frame = 0;
  function updateGame() {
    frame++;
    score++;
    let currentScore = Math.floor(score / 5);
    scoreEl.innerText = currentScore;
    
    let currentLevel = Math.floor(currentScore / 100) + 1;
    if(currentLevel !== level) {
      level = currentLevel;
      levelEl.innerText = level;
      speed += 0.5;
      let colorIndex = (level - 1) % bgColors.length;
      container.style.background = bgColors[colorIndex];
    }

    lines.forEach(line => {
      let top = parseInt(line.style.top);
      top += speed;
      if(top > 480) top = -40;
      line.style.top = top + 'px';
    });

    if(frame % 70 === 0) spawnEnemy();
    if(frame % 350 === 0) spawnPowerup();

    powerups.forEach((pObj, index) => {
      let top = parseInt(pObj.el.style.top);
      top += speed;
      pObj.el.style.top = top + 'px';

      if(top > 370 && top < 450 && pObj.lane === currentLane) {
        playPowerupSound();
        hasShield = true;
        player.classList.add('shielded');
        pObj.el.remove();
        powerups.splice(index, 1);
      } else if(top > 500) {
        pObj.el.remove();
        powerups.splice(index, 1);
      }
    });

    enemies.forEach((enemyObj, index) => {
      let top = parseInt(enemyObj.el.style.top);
      top += speed;
      enemyObj.el.style.top = top + 'px';

      if(top > 370 && top < 450 && enemyObj.lane === currentLane) {
        if(hasShield) {
          playPowerupSound();
          hasShield = false;
          player.classList.remove('shielded');
          enemyObj.el.remove();
          enemies.splice(index, 1);
        } else {
          playCrashSound();
          triggerShake();
          gameOver(currentScore);
        }
      }

      if(top > 500) { enemyObj.el.remove(); enemies.splice(index, 1); }
    });
  }

  function triggerShake() {
    container.classList.add('shake');
    setTimeout(() => container.classList.remove('shake'), 300);
  }

  function gameOver(finalScore) {
    isPlaying = false;
    clearInterval(gameInterval);

    if(finalScore > highscore) {
      highscore = finalScore;
      localStorage.setItem('player_best_score', highscore);
      highscoreEl.innerText = highscore;
      recordBanner.style.display = 'block';
    } else {
      recordBanner.style.display = 'none';
    }

    gameTitle.innerText = "GAME OVER";
    scoreDetails.innerHTML = `Your Score: <b>${finalScore}</b><br>Personal Best: <b>${highscore}</b>`;
    startBtn.innerText = "TRY AGAIN 🔄";
    overlay.style.display = 'flex';
  }
</script>
</body>
</html>
