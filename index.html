<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turbo Racer - Ahatesham</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: #fff; overflow: hidden; }
    
    /* Corner Name Badge */
    .creator-badge { position: absolute; top: 15px; right: 15px; background: rgba(56, 189, 248, 0.15); border: 1px solid #38bdf8; color: #38bdf8; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; letter-spacing: 0.5px; backdrop-filter: blur(5px); z-index: 100; }

    #game-container { position: relative; width: 340px; height: 480px; background: #1e293b; border: 4px solid #38bdf8; border-radius: 12px; overflow: hidden; box-shadow: 0 0 25px rgba(56, 189, 248, 0.3); }
    .road-line { position: absolute; width: 6px; height: 40px; background: #64748b; left: 50%; transform: translateX(-50%); }
    #player { position: absolute; bottom: 20px; left: 140px; width: 40px; height: 70px; background: #ef4444; border-radius: 8px; border: 2px solid #991b1b; transition: left 0.05s ease; z-index: 2; }
    #player::before { content: ''; position: absolute; top: 12px; left: 6px; width: 24px; height: 16px; background: #38bdf8; border-radius: 3px; }
    .enemy { position: absolute; width: 40px; height: 70px; background: #eab308; border-radius: 8px; border: 2px solid #854d0e; }
    
    #ui { display: flex; gap: 20px; margin-bottom: 12px; font-size: 15px; font-weight: bold; background: #0f172a; padding: 8px 18px; border-radius: 20px; border: 1px solid #334155; }
    .val { color: #facc15; }
    #controls { margin-top: 15px; display: flex; gap: 20px; }
    .btn { padding: 14px 28px; font-size: 18px; font-weight: bold; background: #1e293b; border: 2px solid #38bdf8; color: #38bdf8; border-radius: 10px; cursor: pointer; }
    
    #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.92); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; padding: 20px; text-align: center; }
    #start-btn { padding: 12px 26px; font-size: 16px; font-weight: bold; background: #22c55e; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; }
    .record-msg { color: #4ade80; font-size: 14px; margin-top: 8px; font-weight: bold; }
  </style>
</head>
<body>

<!-- Corner Name -->
<div class="creator-badge">Created by: Ahatesham</div>

<div id="ui">
  <div>Score: <span id="score" class="val">0</span></div>
  <div>Personal Best: <span id="highscore" class="val">0</span></div>
</div>

<div id="game-container">
  <div id="player"></div>
  <div id="overlay">
    <h1 id="game-title" style="color: #38bdf8; font-size: 26px;">TURBO RACER</h1>
    <p id="score-details" style="font-size: 14px; color: #94a3b8; margin-top: 8px;">Try to set a new High Score!</p>
    <div id="record-banner" class="record-msg" style="display: none;">🎉 NEW PERSONAL BEST!</div>
    <button id="start-btn" onclick="startGame()">START GAME</button>
  </div>
</div>

<div id="controls">
  <button class="btn" onclick="moveLeft()">◀ LEFT</button>
  <button class="btn" onclick="moveRight()">RIGHT ▶</button>
</div>

<script>
  const container = document.getElementById('game-container');
  const player = document.getElementById('player');
  const scoreEl = document.getElementById('score');
  const highscoreEl = document.getElementById('highscore');
  const overlay = document.getElementById('overlay');
  const gameTitle = document.getElementById('game-title');
  const scoreDetails = document.getElementById('score-details');
  const recordBanner = document.getElementById('record-banner');
  const startBtn = document.getElementById('start-btn');

  let playerX = 140;
  let score = 0;
  let highscore = localStorage.getItem('player_best_score') || 0;
  highscoreEl.innerText = highscore;

  let gameInterval;
  let isPlaying = false;
  let speed = 5;
  let enemies = [];
  let lines = [];

  for(let i=0; i<5; i++) {
    let line = document.createElement('div');
    line.className = 'road-line';
    line.style.top = (i * 110) + 'px';
    container.appendChild(line);
    lines.push(line);
  }

  function moveLeft() { if(isPlaying && playerX > 30) playerX -= 100; player.style.left = playerX + 'px'; }
  function moveRight() { if(isPlaying && playerX < 210) playerX += 100; player.style.left = playerX + 'px'; }

  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowLeft') moveLeft();
    if(e.key === 'ArrowRight') moveRight();
  });

  function startGame() {
    overlay.style.display = 'none';
    recordBanner.style.display = 'none';
    isPlaying = true;
    score = 0; speed = 5; playerX = 140;
    player.style.left = playerX + 'px';
    scoreEl.innerText = score;
    
    enemies.forEach(e => e.remove()); enemies = [];
    clearInterval(gameInterval);
    gameInterval = setInterval(updateGame, 20);
  }

  function spawnEnemy() {
    const lanes = [30, 130, 230];
    let lane = lanes[Math.floor(Math.random() * lanes.length)];
    let enemy = document.createElement('div');
    enemy.className = 'enemy';
    enemy.style.left = lane + 'px';
    enemy.style.top = '-80px';
    container.appendChild(enemy);
    enemies.push(enemy);
  }

  let frame = 0;
  function updateGame() {
    frame++;
    score++;
    let currentScore = Math.floor(score / 5);
    scoreEl.innerText = currentScore;
    
    if(score % 200 === 0) speed += 0.5;

    lines.forEach(line => {
      let top = parseInt(line.style.top);
      top += speed;
      if(top > 480) top = -40;
      line.style.top = top + 'px';
    });

    if(frame % 70 === 0) spawnEnemy();

    enemies.forEach((enemy, index) => {
      let top = parseInt(enemy.style.top);
      top += speed;
      enemy.style.top = top + 'px';

      let enemyLeft = parseInt(enemy.style.left);
      
      if(top > 370 && top < 450 && Math.abs(enemyLeft - playerX) < 30) {
        gameOver(currentScore);
      }

      if(top > 500) { enemy.remove(); enemies.splice(index, 1); }
    });
  }

  function gameOver(finalScore) {
    isPlaying = false;
    clearInterval(gameInterval);

    if(finalScore > highscore) {
      highscore = finalScore;
      localStorage.setItem('player_best_score', highscore);
      highscoreEl.innerText = highscore;
      recordBanner.style.display = 'block';
    } else {
      recordBanner.style.display = 'none';
    }

    gameTitle.innerText = "GAME OVER";
    scoreDetails.innerHTML = `Your Score: <b>${finalScore}</b><br>Personal Best: <b>${highscore}</b>`;
    startBtn.innerText = "BREAK YOUR RECORD 🔄";
    overlay.style.display = 'flex';
  }
</script>
</body>
</html>
